// JKGunplay combat classes
// Copy this file to <gamedata>/base/ext_data/jkg_combat_classes.cfg
//
// Assign on an NPC type in ext_data/NPCs.cfg (inside that NPC's brace block):
//   combatClass	rifle
//
// The class named "default" is used when combatClass is omitted.
// Optional keys (omitted keys use the matching g_jkgCombat* cvar):
//   idealRangeMin / rangeMin, idealRangeMax / rangeMax, rangeBand,
//   moveDelay, stepDist, strafeDist, strafeTime, strafePause, huntCheatMs

